# Jev grounding 골든셋 (q-v1, jev-1.13.0) — 실측 fixture 기반, 정답은 후보 이름으로 참조(실행 시 키로 해석).
#
# ── 사전등록 기준 (2026-09-26, 첫 실호출 전에 작성·고정) ──────────────────────────────
# 1. 확신 오답(confident-wrong) = 0 건. 정의:
#    - 정답이 대상(target)인데 게이트가 다른 후보로 pass, 또는 not_found
#    - 정답이 none(부재·가림)인데 게이트가 어떤 후보로든 pass
#    - 정답이 ambiguous(같은 이름 중복)인데 게이트가 pass 또는 not_found
# 2. 수용률(accepted / 전체) ≥ 80%. accepted = target→그 후보로 pass, none→not_found, ambiguous→ambiguous.
#    ambiguous 판정으로 정답을 놓친 경우는 rejected(안전한 비수용).
# 3. 기준은 엄격(strict, `see`) 게이트로 판정한다. 비엄격(tap/type)의 차이 구제(rescueGap)는 확신 오답을
#    늘리지 않고 수용을 늘릴 때만 켠다.
# 4. 임계값 탐색: 0.01 격자, (확신 오답 최소 → 수용 최대 → 경계 여백 leximin 최대) 순. 기준 미달이면
#    레코드에 status: failed로 기록하고 런타임은 계속 fail-closed(uncalibrated).
# 5. 숫자 크기 비교("가장 많이 남은")처럼 Jev가 약한 산술 의도는 제외(결정적 checkEach 대상).
# 6. 한국어 성능은 언어별(ko/en)로 따로 보고한다. 골든셋 수정 시 다시 사전등록 후 재실행.
# ── 정정 기록 (2026-09-26, 1차 실호출 직후; 위 기준·정답·항목은 그대로) ──
# 4번의 3순위(동률 처리) 구현만 정정: 한쪽에만 항목이 있는 임계값이 느슨한 격자 끝(noneMin 0.30)으로 가던 결함.
# 이제 결과가 같은 구간 안에서, 양쪽이 항목으로 막히면 중점, 한쪽이 격자 끝이면 보수적 끝을 고른다.
# 1차 녹화 응답(test/jev/recordings)을 그대로 재사용해 다시 산출했다(재질의 없음).
