# Jev review(생성 테스트 검토, Noul 3+1) 골든셋 (q-v1, jev-1.13.0)
# 요구사항 출처: 떠남 CONTEXT.md(용어·규칙), docs/adr/0003-t2-departure-shows-forecast-only.md.
# 테스트는 src/spec/schema.ts TestSpec으로 검증되는 YAML이며 실제 화면 라벨(fixture 인벤토리)을 쓴다.
# 요구사항 문자열은 플래너(src/plan/index.ts)와 같은 모양 "[<id>] <본문>"으로 보낸다.
#
# ── 사전등록 기준 (2026-09-26, 이 파일의 첫 실호출 전에 작성·고정) ──────────────────────────
# 종류(kind)와 Noul별 정답(expect; null = 채점 안 함):
#   good               addresses=T unrelated=F clarification=F asserts=T  → 승인 가능(approvable)이 정답
#   missing_assertion  addresses=F unrelated=F clarification=F asserts=F  → draft (기대 결과 하나 이상을 확인하지 않음)
#   unrelated_steps    addresses=T unrelated=T clarification=F asserts=T  → draft
#   wrong_requirement  addresses=F unrelated=T clarification=F asserts=F  → draft (다른 요구사항을 검증)
#   vague_requirement  clarification=T, 나머지 null                        → draft
# 1. 확신 오답 = 0: 결함 있는 항목(good 외 전부)이 게이트에서 approvable.
# 2. good 항목 승인율 ≥ 80%.
# 3. 게이트 = addresses ≥ addressesMin AND unrelated ≤ unrelatedMax AND clarification ≤ clarificationMax
#    (+ asserts ≥ assertsMin, 채택 시). 탐색: addressesMin·assertsMin ∈ [0.50, 0.99], unrelatedMax·clarificationMax ∈
#    [0.01, 0.50], 0.01 격자. 확신 오답 최소 → good 승인 최대 → 같은 결과 구간 안에서 양쪽이 항목으로 막히면 중점,
#    한쪽이 격자 끝이면 보수적 끝.
# 4. 4번째 Noul asserts_all_expected(같은 요청에 함께 질문)는 (a) 단독으로 asserts 정답 F 항목이 하나도 assertsMin 이상이
#    아니면서 정답 T 항목의 80% 이상이 assertsMin 이상인 임계값이 있고, (b) 넣은 게이트가 1·2를 만족할 때만 채택한다.
#    채택하지 않으면 q-v1 review 질문에서 빼고 review 항목을 3개 질문으로 다시 물어 런타임 요청 = 보정 요청을 유지한다.
# 5. 1·2 미달이면 review.status = failed → 플래너는 모든 테스트를 draft로 둔다(fail-closed).
# 6. Noul별 분리도(자기 정답 대비 정확도)는 참고로만 보고한다.
# ── 결과 기록 (2026-09-26, 1차 실호출 후; 위 기준·정답·항목은 그대로) ──
# 4번 판정: asserts_all_expected 미채택 — 4개 질문 요청으로 30건을 물었을 때 단독 분리 실패(가장 느슨한 0.50에서도
# 거짓 항목 0개 통과였지만 참 항목은 11/16만 0.50 이상, 80% 미달). 사전등록대로 질문에서 빼고 review 30건을 3개 질문으로
# 다시 물어 임계값을 정했다. 4개 질문 응답 녹화는 런타임 요청과 달라 지웠다.
primitive: review
criteria: { maxConfidentWrong: 0, minGoodApproval: 0.8 }
