# Jev claim(Noul) 골든셋 (q-v1, jev-1.13.0) — 실측 fixture 화면에 대한 참/거짓/부재 주장.
#
# ── 사전등록 기준 (2026-09-26, 첫 실호출 전에 작성·고정) ──────────────────────────────
# 1. 확신 오답 = 0 건: 거짓 주장이 pass(P ≥ yes) 또는 참 주장이 fail(P ≤ no).
# 2. 수용률 ≥ 80%: 참→pass, 거짓→fail. 그 사이(inconclusive)는 rejected(안전한 비수용).
# 3. 임계값 탐색: yes ∈ [0.50, 0.99], no ∈ [0.01, 0.49], 0.01 격자, (확신 오답 최소 → 수용 최대 →
#    경계 여백 leximin 최대). Choice(grounding/which) 임계값과 공유하지 않는다.
# 4. 부재·빈 상태 주장(absence)과 한국어/영어를 따로 보고한다. 숫자 크기 비교 주장은 제외(checkEach 대상).
# 5. 판정 근거는 화면 행·텍스트뿐이다(좌표·스크린샷 없음). 기준 미달이면 status: failed.
# ── 정정 기록 (2026-09-26, 1차 실호출 직후; 위 기준·정답·항목은 그대로) ──
# 3번의 3순위(동률 처리) 구현만 정정: 한쪽에만 항목이 있는 임계값이 느슨한 격자 끝(no 0.49)으로 가던 결함.
# 이제 결과가 같은 구간 안에서, 양쪽이 항목으로 막히면 중점, 한쪽이 격자 끝이면 보수적 끝을 고른다.
# 1차 녹화 응답(test/jev/recordings)을 그대로 재사용해 다시 산출했다(재질의 없음).
