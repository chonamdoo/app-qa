<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pick a time with Dana · Slotwise</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="schedule-en.html">Slotwise</a>
  </header>

  <main class="narrow">
    <h1>30-minute intro call with Dana Wu</h1>
    <section class="card">
      <div class="spread">
        <span>Week of Oct 6 · Times in Korea Standard Time</span>
        <div class="row"><button type="button" class="link">Change time zone</button><button type="button" class="ghost">Next week</button></div>
      </div>
      <div class="row" role="group" aria-label="Available times" data-pressed-group style="margin-top: 8px">
        <button type="button" class="ghost" aria-pressed="false">Tue 9:00 AM</button>
        <button type="button" class="ghost" aria-pressed="true">Tue 10:30 AM</button>
        <button type="button" class="ghost" aria-pressed="false">Wed 4:00 PM</button>
      </div>
    </section>
    <form class="card" data-done="Invites sent to you and Dana">
      <p>Tue, Oct 7 · 10:30–11:00 AM · Video call</p>
      <p class="muted">Calendar invites go to jordan.lee@example.com and Dana Wu.</p>
      <button type="button" class="link">Add note</button>
      <div class="row end"><button type="submit">Schedule meeting</button></div>
    </form>
    <p role="status"></p>
  </main>
  <script src="../app.js"></script>
</body>
</html>
