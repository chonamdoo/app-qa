<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Write a review · Trailhead Outfitters</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="review-app-en.html">Trailhead Outfitters</a>
  </header>

  <main class="narrow">
    <h1>Review: Ridgeline 45L Backpack</h1>
    <form class="card" data-done="Thanks! Your review will appear on the product page.">
      <fieldset>
        <legend>Your rating</legend>
        <label class="inline"><input type="radio" name="stars"> 5 stars</label>
        <label class="inline"><input type="radio" name="stars" checked> 4 stars</label>
        <label class="inline"><input type="radio" name="stars"> 3 stars</label>
      </fieldset>
      <label for="headline">Headline</label>
      <input id="headline" value="Comfortable on a 3-day hike" style="width: 100%">
      <label for="text">Review</label>
      <textarea id="text">Hip belt is great, side pockets are a bit tight for 1L bottles.</textarea>
      <p class="muted">Reviews are public and show your first name. <a href="review-app-en.html#guidelines">Review guidelines</a></p>
      <div class="row end"><button type="submit">Submit review</button></div>
    </form>
    <p role="status"></p>
  </main>
  <script src="../app.js"></script>
</body>
</html>
