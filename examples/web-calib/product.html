<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>무선 이어폰 프로 · 모아마켓</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="shop.html">모아마켓</a>
    <nav>
      <a href="signup.html">회원가입</a>
      <a href="cart.html">장바구니 2</a>
    </nav>
  </header>

  <main>
    <div class="card">
      <p class="muted"><a href="shop.html">이어폰</a> › 무선 이어폰</p>
      <h1>무선 이어폰 프로</h1>
      <p><span class="price">39,000원</span> <span class="muted">무료배송 · 내일(금) 도착 예정</span></p>
      <div class="row">
        <span>수량</span>
        <button type="button" class="ghost" aria-label="수량 줄이기" data-step="-1" data-target="qty">−</button>
        <output id="qty">1</output>
        <button type="button" class="ghost" aria-label="수량 늘리기" data-step="1" data-target="qty">+</button>
      </div>
      <div class="row" style="margin-top: 12px">
        <button type="button" class="ghost" data-status="장바구니에 넣었습니다">장바구니 담기</button>
        <button type="button" class="dark">바로 구매</button>
        <button type="button" class="link" data-status="링크를 복사했습니다">링크 복사</button>
        <button type="button" class="link">공유하기</button>
      </div>
      <p role="status"></p>
    </div>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" aria-selected="true" aria-controls="tab-info">상품 정보</button>
      <button type="button" role="tab" aria-selected="false" aria-controls="tab-reviews">리뷰 (1,204)</button>
      <button type="button" role="tab" aria-selected="false" aria-controls="tab-qna">문의 (38)</button>
    </div>
    <section id="tab-info" class="card">
      <p>블루투스 5.3 · 최대 30시간 재생 · IPX4 생활 방수. 케이스 포함 무게 48g.</p>
      <button type="button" class="link" aria-expanded="false" aria-controls="ship-body">배송·반품 안내</button>
      <div id="ship-body" class="acc-body" hidden><p>수령 후 7일 안에 반품할 수 있습니다.</p></div>
    </section>
    <section id="tab-reviews" class="card" hidden><p>★★★★★ 통화 품질이 좋아요. — 김**</p></section>
    <section id="tab-qna" class="card" hidden><p>문의 38건</p></section>
    <div class="spread">
      <p class="muted">구매한 상품이라면 사용 후기를 남겨 주세요.</p>
      <a href="review-write.html">리뷰 쓰기</a>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
