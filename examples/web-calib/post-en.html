<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New discussion · Fieldnotes Forum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="post-en.html">Fieldnotes Forum</a>
    <nav><a href="post-en.html">Discussions</a><a href="account-en.html">Settings</a></nav>
  </header>

  <main class="narrow">
    <h1>Start a new discussion</h1>
    <form class="card" data-done="Your discussion is live">
      <label for="title">Title</label>
      <input id="title" value="Best budget tripod for night sky shots?" style="width: 100%">
      <label for="body">Message</label>
      <textarea id="body">I'm shooting the Milky Way next month with a 14mm lens. Anything under $120 that won't wobble in wind?</textarea>
      <label for="cat">Category</label>
      <select id="cat"><option>Gear</option><option>Technique</option></select>
      <p class="muted">Everyone in the forum can see and reply to this post. <a href="post-en.html#help">Formatting help</a></p>
      <div class="row end">
        <button type="button" class="ghost">Cancel</button>
        <button type="button" class="ghost" data-status="Preview ready">Preview</button>
        <button type="submit">Post</button>
      </div>
    </form>
    <p role="status"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
