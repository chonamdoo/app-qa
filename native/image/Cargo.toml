[package]
name = "app_qa_image"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.16.1", default-features = false, features = ["napi8"] }
napi-derive = "=3.7.0"

[build-dependencies]
napi-build = "=2.6.0"

[profile.release]
lto = "thin"
codegen-units = 1
